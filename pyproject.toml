# Public workspace root for the Genesis Framework (published snapshot).
[project]
name = "genesis-framework-workspace"
version = "0.1.0"
description = "Workspace root — see packages/genesis-gates and packages/genesis-cli."
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
genesis-gates = { workspace = true }
genesis-cli = { workspace = true }

[dependency-groups]
dev = [
    "genesis-gates",
    "genesis-cli",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "jsonschema>=4",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Pin collection to the package test dirs: `providers/conftest.py` is an OPA
# *provider module*, not a pytest conftest — letting pytest walk src/ makes it
# import-collide and error the run.
testpaths = ["packages/genesis-gates/tests", "packages/genesis-cli/tests"]
norecursedirs = ["src", "examples", "fixtures", "build", ".venv", "node_modules"]

[tool.ruff]
# MUST mirror the monorepo's ruff config: these packages are developed there and
# published here, so both repos have to judge the same source by the same rules.
# Without the explicit lint.select below, ruff applies a different default set
# and the published tree fails lint on rules the code was never written against.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI-style Depends() in defaults
    "UP042",  # str+Enum is intentional for SQLAlchemy Enum columns
]
