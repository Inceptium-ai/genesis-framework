# Public workspace root for the Genesis Framework (published snapshot).
[project]
name = "genesis-framework-workspace"
version = "0.1.0"
description = "Workspace root — see packages/genesis-gates and packages/genesis-cli."
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
genesis-gates = { workspace = true }
genesis-cli = { workspace = true }

[dependency-groups]
dev = [
    "genesis-gates",
    "genesis-cli",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "jsonschema>=4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
