[project]
name = "genesis-gates"
version = "0.2.0"
description = "Genesis delivery-governance gate engine: deterministic gates, system-completeness analysis, readiness scoring, and versioned JSON Schema contracts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Inceptium", email = "opensource@inceptium.ai" }]
keywords = [
    "ci",
    "code-quality",
    "devsecops",
    "governance",
    "sarif",
    "static-analysis",
    "supply-chain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Inceptium-ai/genesis-framework"
Repository = "https://github.com/Inceptium-ai/genesis-framework"
Documentation = "https://github.com/Inceptium-ai/genesis-framework/blob/main/docs/architecture.md"
Issues = "https://github.com/Inceptium-ai/genesis-framework/issues"
Changelog = "https://github.com/Inceptium-ai/genesis-framework/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "contracts", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/genesis_gates"]

[tool.hatch.build.targets.wheel.force-include]
# The JSON Schema contracts are the SSOT and must travel with the wheel;
# `contracts.py` resolves them at `genesis_gates/contracts` when installed.
# The README ships alongside so an installed copy documents itself.
"contracts" = "genesis_gates/contracts"
"README.md" = "genesis_gates/README.md"
