[project]
name = "genesis-gates"
version = "0.1.0"
description = "Genesis delivery-governance gate engine (vendored from Lucidium genesis-toolkit)"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genesis_gates"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "genesis_gates/contracts"
