[project]
name = "genesis-cli"
version = "0.1.0"
description = "Genesis Agent Workbench CLI — make any repo agent-ready and keep AI-generated changes governed."
requires-python = ">=3.12"
dependencies = [
    "genesis-gates",
    "pyyaml>=6.0",
]

[project.scripts]
genesis = "genesis_cli.main:main"

[tool.uv.sources]
genesis-gates = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genesis_cli"]
